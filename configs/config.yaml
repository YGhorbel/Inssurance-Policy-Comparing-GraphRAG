minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket_name: "regulations"
  secure: false

neo4j:
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "password"

models:
  hf_token: "" # Set via env var HF_TOKEN usually
  model_id: "LiquidAI/LFM2-2.6B-Exp"

processing:
  chunk_size: 800
  chunk_overlap: 150

embeddings:
  model_id: "BAAI/bge-m3"
  dim: 1024
  sparse_enabled: true
  max_length: 1024
  batch_size: 8

qdrant:
  url: "http://localhost:6333"
  collection: "regulations_chunks_v2"
  # 384-dim legacy collections (`regulations`, `regulations_chunks`) were
  # dropped in Subtask E.4 — Subtask B's 1024-dim hybrid replacement
  # passed the MultiHop-RAG retrieval-quality bar (E.2: Recall@5=0.672
  # on the answerable subset) and the regulations post-B baseline
  # (50/50 slot fill, 7/7 edge types live).
